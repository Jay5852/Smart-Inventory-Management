<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal - SyncTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .employee-portal {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .login-screen {
            text-align: center;
            margin-top: 100px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            max-width: 400px;
            margin: 0 auto;
        }

        .login-input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-dark);
            color: white;
        }

        .portal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .component-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .comp-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .comp-card h3 {
            margin-bottom: 10px;
        }

        .status-in {
            color: var(--success);
        }

        .status-out {
            color: var(--warning);
        }

        .request-btn {
            width: 100%;
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }

        .my-requests {
            margin-top: 40px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="employee-portal">

        <!-- LOGIN SCREEN -->
        <div id="login-view" class="login-screen">
            <div class="logo" style="justify-content: center; margin-bottom: 20px;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                </svg>
                <h2>SyncTrack</h2>
            </div>
            <div class="login-card">
                <h3>Employee Portal Login</h3>
                <p style="color:var(--text-secondary); margin-top:10px;">Select your employee profile to request
                    equipment</p>
                <select id="emp-select" class="login-input">
                    <option value="">Loading employees...</option>
                </select>
                <button class="btn-primary" style="width:100%" onclick="login()">Enter Portal</button>
            </div>
        </div>

        <!-- PORTAL VIEW -->
        <div id="portal-view" class="hidden">
            <div class="portal-header">
                <div>
                    <h1>Welcome, <span id="emp-name-display"></span></h1>
                    <p style="color:var(--text-secondary)">Request equipment for checkout</p>
                </div>
                <button class="btn-secondary" onclick="logout()">Logout</button>
            </div>

            <h2>Available Equipment</h2>
            <div class="component-grid" id="equipment-grid">
                <!-- Loaded via JS -->
            </div>

            <div class="my-requests">
                <h2>My Pending Requests</h2>
                <table class="data-table" style="margin-top:20px;">
                    <thead>
                        <tr>
                            <th>Equipment</th>
                            <th>Status</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="my-requests-tbody">
                        <tr>
                            <td colspan="3" class="text-center">No pending requests</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="employee.js"></script>
</body>

</html>
